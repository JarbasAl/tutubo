name: Auto Alpha Release on PR merge to dev
on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  release_alpha:
    uses: OpenVoiceOS/gh-automations/.github/workflows/release_workflow.yml@dev
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
    with:
      version_file: tutubo/version.py
      package_name: tutubo
